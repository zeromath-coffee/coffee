<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음료 주문 게시판</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .drink {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
            background: #fafafa;
        }

        .drink-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #555;
        }

        .order-form {
            border-top: 1px solid #ddd;
            padding-top: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f0f8ff;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🥤 음료 주문 게시판</h1>

        <p class="description">
            원하는 음료를 선택하고 주문자 이름을 입력해주세요.
        </p>

        <!-- 음료 메뉴 -->
        <div class="menu">

            <div class="drink">
                <div class="drink-name">아메리카노</div>
                <div class="price">1,500원</div>
            </div>

            <div class="drink">
                <div class="drink-name">카페라떼</div>
                <div class="price">2,000원</div>
            </div>

            <div class="drink">
                <div class="drink-name">바닐라라떼</div>
                <div class="price">2,500원</div>
            </div>

            <div class="drink">
                <div class="drink-name">과일 에이드</div>
                <div class="price">2,500원</div>
            </div>

        </div>

        <!-- 주문 입력 -->
        <div class="order-form">

            <label for="name">주문자 이름</label>
            <input
                type="text"
                id="name"
                placeholder="이름을 입력하세요"
            >

            <label for="drink">음료 선택</label>
            <select id="drink">
                <option value="">음료를 선택하세요</option>
                <option value="아메리카노 - 3,000원">아메리카노 - 3,000원</option>
                <option value="카페라떼 - 4,000원">카페라떼 - 4,000원</option>
                <option value="바닐라라떼 - 4,500원">바닐라라떼 - 4,500원</option>
                <option value="초콜릿 - 4,000원">초콜릿 - 4,000원</option>
            </select>

            <button onclick="submitOrder()">
                주문하기
            </button>

        </div>

        <!-- 주문 결과 -->
        <div id="result"></div>

    </div>

    <script>
        function submitOrder() {

            const name = document.getElementById("name").value;
            const drink = document.getElementById("drink").value;
            const result = document.getElementById("result");

            if (name === "" || drink === "") {
                alert("주문자 이름과 음료를 모두 입력해주세요.");
                return;
            }

            result.style.display = "block";

            result.innerHTML = `
                <strong>주문이 완료되었습니다! 🎉</strong><br><br>
                주문자: ${name}<br>
                주문 음료: ${drink}
            `;

            // 입력값 초기화
            document.getElementById("name").value = "";
            document.getElementById("drink").value = "";
        }
    </script>

</body>
</html>
