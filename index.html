<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COFFEE & Fruit cheong - 음료 주문 게시판</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #6b4423; color: white; border: none; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .status-board { margin-top: 30px; border-top: 2px solid #ddd; padding-top: 15px; }
    .order-item { border-bottom: 1px solid #eee; padding: 8px 0; }
  </style>
</head>
<body>

  <h2>☕ 주문하기</h2>
  <form id="order-form" onsubmit="handleOrderSubmit(event)">
    <div class="form-group">
      <label for="order-name">주문자 이름</label>
      <input type="text" id="order-name" placeholder="이름을 입력해주세요" required>
    </div>

    <div class="form-group">
      <label for="selected-drink">선택한 음료</label>
      <select id="selected-drink" required>
        <option value="">음료를 선택해주세요</option>
        <option value="아메리카노">아메리카노</option>
        <option value="카페라떼">카페라떼</option>
        <option value="과일 에이드">과일 에이드</option>
      </select>
    </div>

    <div class="form-group">
      <label for="order-quantity">수량</label>
      <input type="number" id="order-quantity" value="1" min="1" max="20" required>
    </div>

    <button type="submit" id="submit-btn">주문 등록하기</button>
  </form>

  <div class="status-board">
    <h3>📋 오늘의 주문현황 (<span id="total-count">0</span>/20잔)</h3>
    <div id="order-list"></div>
  </div>

  <script>
    const MAX_LIMIT = 20;
    let todayOrders = [];

    // 현재 총 주문 수량 계산
    function getTotalOrderedQuantity() {
      return todayOrders.reduce((total, order) => total + Number(order.quantity), 0);
    }

    // 주문 등록 처리
    function handleOrderSubmit(event) {
      event.preventDefault();

      const nameInput = document.getElementById('order-name');
      const drinkSelect = document.getElementById('selected-drink');
      const quantityInput = document.getElementById('order-quantity');

      const orderName = nameInput.value.trim();
      const selectedDrink = drinkSelect.value;
      const orderQuantity = Number(quantityInput.value);

      const currentTotal = getTotalOrderedQuantity();

      // 1. 이미 20잔 달성 여부 확인
      if (currentTotal >= MAX_LIMIT) {
        alert("죄송합니다. 오늘 준비된 수량(20잔)이 모두 마감되었습니다.");
        return;
      }

      // 2. 신청 수량이 남은 수량을 초과하는지 확인
      if (currentTotal + orderQuantity > MAX_LIMIT) {
        const remaining = MAX_LIMIT - currentTotal;
        alert(`죄송합니다. 현재 남은 수량은 ${remaining}잔입니다.`);
        return;
      }

      // 3. 주문 저장
      const newOrder = {
        name: orderName,
        drink: selectedDrink,
        quantity: orderQuantity,
        time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      };

      todayOrders.push(newOrder);
      alert("주문이 성공적으로 등록되었습니다!");

      // 폼 초기화 및 화면 갱신
      nameInput.value = '';
      drinkSelect.value = '';
      quantityInput.value = 1;

      renderOrders();
      checkSoldOutStatus();
    }

    // 주문 목록 및 잔 수 화면 표시
    function renderOrders() {
      const orderListEl = document.getElementById('order-list');
      const totalCountEl = document.getElementById('total-count');

      totalCountEl.innerText = getTotalOrderedQuantity();
      orderListEl.innerHTML = '';

      todayOrders.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerText = `${index + 1}. ${item.name}님 - ${item.drink} x ${item.quantity}개 (${item.time})`;
        orderListEl.appendChild(div);
      });
    }

    // 마감 상태 체크 및 버튼 변경
    function checkSoldOutStatus() {
      const currentTotal = getTotalOrderedQuantity();
      const submitBtn = document.getElementById('submit-btn');

      if (currentTotal >= MAX_LIMIT) {
        submitBtn.disabled = true;
        submitBtn.innerText = "오늘 주문 마감 (20잔 완료)";
      }
    }
  </script>
</body>
</html>
